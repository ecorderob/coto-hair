<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f0e6" />
  <title>COTO Hair — Uudet sivut avautuvat pian · Kempele</title>
  <meta name="description" content="COTO Hair, kotoisa kampaamo Kempeleessä. Uudet verkkosivut avautuvat pian." />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />

  <style>
    .soon {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--s-8) var(--gutter);
      gap: var(--s-5);
    }
    .soon__logo { width: clamp(180px, 40vw, 280px); height: auto; }
    .soon__rule {
      width: 56px;
      height: 1px;
      background: var(--c-sienna);
      border: 0;
      margin: var(--s-2) 0;
    }
    .soon__eyebrow {
      font-family: var(--f-display);
      font-size: var(--fs-eyebrow);
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--c-sienna);
      margin: 0;
    }
    .soon__title {
      font-family: var(--f-display);
      font-weight: 300;
      font-size: var(--fs-h2);
      line-height: 1.1;
      letter-spacing: 0.02em;
      margin: 0;
    }
    .soon__title em {
      font-family: var(--f-text);
      font-style: italic;
      font-weight: 400;
      color: var(--c-sienna);
    }
    .soon__lead {
      font-size: var(--fs-lead);
      color: var(--c-mute);
      max-width: 34em;
      margin: 0;
    }
    .soon__contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--s-3) var(--s-6);
      font-family: var(--f-display);
      font-size: var(--fs-meta);
      letter-spacing: 0.08em;
    }
    .soon__contact a { border-bottom: 1px solid var(--c-line-strong); padding-bottom: 2px; }
    .soon__contact a:hover { border-color: var(--c-sienna); }
    .soon__foot {
      font-family: var(--f-display);
      font-size: var(--fs-meta);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-mute);
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="soon" id="main">
    <img class="soon__logo" src="assets/coto-hair-logo-copper.svg" alt="Coto Hair" />
    <hr class="soon__rule" />
    <p class="soon__eyebrow">Kotikampaamo · Kempele</p>
    <h1 class="soon__title">Uudet sivut <em>avautuvat pian.</em></h1>
    <p class="soon__lead">
      Valmistelemme COTO Hairin uusia verkkosivuja. Palaa pian takaisin,
      tai ota yhteyttä suoraan, niin sovitaan aika.
    </p>
    <div class="soon__contact">
    </div>
    <p class="soon__foot">Tervetuloa kotiin</p>
  </main>
</body>
</html>
